server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — unknown paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached, or clients keep the old shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
