services:
  kf-db:
    image: postgres
    container_name: kf_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PW:?POSTGRES_PW must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-kf_db}
    env_file:
      - ../.env
    volumes:
      - ./data_vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-kf_user} -d ${PG_DB:-kf_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    internal: true